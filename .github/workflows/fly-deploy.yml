name: Deploy OpenClaw to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy (gateway|dashboard|all)"
        default: "all"
        required: true

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    if: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if not exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps create evez-openclaw --org evez 2>/dev/null || true

      - name: Create volume if not exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl volumes create openclaw_data --app evez-openclaw --region lax --size 5 2>/dev/null || true

      - name: Set secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            NODE_ENV=production \
            OPENCLAW_STATE_DIR=/data \
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
            GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --app evez-openclaw 2>/dev/null || true

      - name: Deploy gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml --app evez-openclaw --remote-only --wait-timeout 120

  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: deploy-gateway
    if: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create dashboard app if not exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps create evez-openclaw-dashboard --org evez 2>/dev/null || true
      - name: Deploy dashboard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -f "dashboard/fly.toml" ]; then
            flyctl deploy --config dashboard/fly.toml --app evez-openclaw-dashboard --remote-only --wait-timeout 120
          else
            echo "No dashboard fly.toml, skipping"
          fi
