name: NextClaw Probe

on:
  push:
    branches:
      - 'evez-nextclaw/federation-2026-09'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture swarm diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '== PYTHON =='
            python --version
            echo '== COMPILE =='
            python -m py_compile swarm/*.py
            echo "compile_exit=$?"
            echo '== CONTRACT =='
            (cd swarm && python contract_test.py)
            echo "contract_exit=$?"
            echo '== OFFLINE DEMO =='
            (cd swarm && python nextclaw_demo.py)
            echo "demo_exit=$?"
          } > swarm_probe.txt 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextclaw-probe
          path: swarm_probe.txt
          if-no-files-found: error
