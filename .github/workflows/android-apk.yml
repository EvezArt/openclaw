name: Build EvezArt OpenClaw APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: apps/android
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find apps/android -name "*.apk" | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Rename APK
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" evezart-openclaw-a16.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: evezart-openclaw-apk
          path: evezart-openclaw-a16.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "EVEZ OpenClaw A16 — Build ${{ github.run_number }}"
          body: |
            ## EVEZ OpenClaw — Samsung Galaxy A16 APK

            Built from EvezArt/openclaw-fork. EVEZ-OS mesh node pre-configured.

            **Primary endpoint:** https://evez420-evezart-openclaw.hf.space/ (free, always-on)
            **Fallback:** Railway (if payment restored)
            **Offline page:** https://evezart.github.io/

            **Install:**
            1. Download `evezart-openclaw-a16.apk`
            2. Settings → Apps → Special app access → Install unknown apps → enable for your browser/file manager
            3. Tap the APK file and install
          files: evezart-openclaw-a16.apk
          draft: false
          prerelease: false

