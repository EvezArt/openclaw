name: Build EvezArt OpenClaw APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper
        working-directory: apps/android
        run: |
          gradle wrapper --gradle-version=8.7 --distribution-type=bin
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find apps/android -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Rename APK
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" evezart-openclaw-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: evezart-openclaw-apk
          path: evezart-openclaw-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "EvezArt OpenClaw APK (Build ${{ github.run_number }})"
          body: |
            ## EvezArt OpenClaw Android APK
            
            Install this on your Samsung Galaxy A16.
            
            **What this is:** Native Android WebView wrapper for your Railway OpenClaw deployment.
            
            **Connects to:**
            - Primary: https://openclaw-production-49a1.up.railway.app/
            - Fallback: https://openclaw-main-production-dab9.up.railway.app/
            
            **Install:** Download the APK → enable "Install from unknown sources" in Android settings → tap APK file.
          files: evezart-openclaw-debug.apk
          draft: false
          prerelease: false
